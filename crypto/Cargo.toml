# SPDX-License-Identifier: BSD-3-Clause
[package]
name = "dero-crypto"
version = "0.1.0"
edition = "2021"
description = "Clean-room Rust reimplementation of derohe's consensus crypto (differential-tested against the Go reference)"
license = "BSD-3-Clause"
repository = "https://github.com/liqdmetal/derohe-rs"

[dependencies]
tiny-keccak = { version = "2", features = ["keccak", "sha3"] }
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
blake2 = "0.10"
hex = "0.4"
num-bigint = "0.4"
salsa20 = "0.10"
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
siphasher = "1.0"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
crc32fast = "1"
lazy_static = "1"
chacha20 = "0.9"
chacha20poly1305 = "0.10"
getrandom = "0.2"

[[bin]]
name = "dero-oracle"
path = "src/bin/oracle.rs"
