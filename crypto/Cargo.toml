[package]
name = "dero-crypto"
version = "0.1.0"
edition = "2021"
description = "Clean-room Rust reimplementation of derohe's consensus crypto (differential-tested against the Go reference)"

[dependencies]
tiny-keccak = { version = "2", features = ["keccak"] }
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
num-bigint = "0.4"
serde_json = "1"
hex = "0.4"

[[bin]]
name = "dero-oracle"
path = "src/bin/oracle.rs"
