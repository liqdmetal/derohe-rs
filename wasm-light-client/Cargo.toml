[package]
name = "wasm-light-client"
version = "0.1.0"
edition = "2021"
description = "WASM light client for DERO — address parsing, key derivation, tx/block deserialization, and bulletproof verification"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dero-crypto = { path = "../crypto" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
# Pin ark-bn254/ark-ff to match dero-crypto; enable getrandom/js for WASM RNG.
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"

[profile.release]
opt-level = "s"
lto = true
